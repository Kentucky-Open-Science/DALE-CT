# =============================================================================
# Model Comparison Study: Linear Probe Grid Search — TotalSegmentator (118 classes)
# =============================================================================
# Master config for the unified probe training script.
# Trains CLS and patch-level linear probes on pre-extracted embeddings
# from all 4 backbones, using pre-computed ground truth labels.
#
# The TS task uses multi-label BCE with soft fractional labels (118 classes),
# exactly matching the auxiliary head formulation in SoftLabelSupervisionHead.
#
# Usage:
#   python scripts/run_model_comparison_probes.py \
#       --config configs/linear_probe_model_comparison_ts.yaml
# =============================================================================

# --- Task ---
task: "totalseg"
task_type: "multi_label"
num_classes: 118

# --- Embedding Source ---
embeddings:
  root: /app/project/ibi-staff/CT-JEPA/public/outputs/model_comparison_embeddings/
  method: "cropped_256"

  # Models to evaluate (must match subdirectory names)
  models:
    - lejepa_0
    - lejepa_1s
    - lejepa_2s
    - lejepa_1s_v2
    - dinov2_ct
    - lejepa_0_chest

# --- Ground Truth ---
groundtruth:
  root: /app/project/ibi-staff/CT-JEPA/public/outputs/model_comparison_groundtruth/
  task: "totalseg"
  # Patient-level split file (generated by extract_model_comparison_groundtruth.py)
  split_file: "patient_splits.json"

# --- Grid Search Parameters ---
experiment:
  seed: 42
  total_steps: 15000
  eval_freq: 2500
  batch_size: 256
  input_dim: 1024
  save_root: /app/project/ibi-staff/CT-JEPA/public/outputs/model_comparison_probes_totalseg_v3/

  # Minimum positive samples required in eval set for a class to be included
  # in macro metrics. Classes below this threshold get metrics set to 0.0.
  min_positive_samples: 5

  # Probe types to train
  probe_types:
    - cls
    - patch

  # Learning rates for grid search
  learning_rates:
    - 0.1
    - 0.03
    - 0.01
    - 0.003

# --- TotalSegmentator class names (indices 0-117) ---
ts_classes:
