# =============================================================================
# Exp G — slice-spacing (stride) robustness of the MIL probe: ViT-B pair.
# =============================================================================
# Clone of error_bars.yaml restricted to the two ViT-B ablation arms
# (depth-aware slab vs pure-2D intra-slice; features/ctrate/lejepa_base_pretrained[,_2d]).
# TRAIN: each arm's full extracted train pool (24,130 files; identical coverage
#   for both arms -> fair pair; fair-subset manifest only overlaps 1,636 so the
#   4,942-scan subset is NOT available for these arms).
# TEST: the fair-subset 992-scan valid symlinks -> test set IDENTICAL to the
#   error_bars_fair_subset ViT-L probes (dale_ct_0 / dale_ct_0_chest), so stride
#   curves are comparable across all 4 arms on the same scans (absolute levels
#   differ by train-set size; compare degradation slopes across scales).
# Stride evaluation itself: scripts/exp_g_stride_eval.py (after variance).
# =============================================================================
data:
  train_label_path: /app/project/ibi-staff/CT-JEPA/Process_CT-RATE/dataset/train_predicted_labels.csv
  val_label_path: /app/project/ibi-staff/CT-JEPA/Process_CT-RATE/dataset/valid_predicted_labels.csv
  rad_label_path: /app/project/ibi-staff/CT-JEPA/Process_CT-RATE/dataset/RAD-ChestCT/rad_labels.csv
  only_global: false
models:
  vitb_depth_aware:
    input_dim: 768
    ctrate_train: /app/project/ibi-staff/CT-JEPA/features/ctrate/lejepa_base_pretrained/train_cls
    ctrate_valid: /app/project/ibi-staff/CT-JEPA/features/ctrate_fair_subset/vitb_depth_aware/valid
  vitb_pure_2d:
    input_dim: 768
    ctrate_train: /app/project/ibi-staff/CT-JEPA/features/ctrate/lejepa_base_pretrained_2d/train_cls
    ctrate_valid: /app/project/ibi-staff/CT-JEPA/features/ctrate_fair_subset/vitb_pure_2d/valid
experiment:
  split_seed: 42
  total_steps: 15000
  eval_freq: 2500
  batch_size: 16
  num_workers: 0
  num_cache_workers: 8
  input_dim: 1024
  num_classes: 18
  pooling_mode: embedding
  pooling_schemes:
  - average
  - max
  - learned_attention
  learning_rates:
  - 0.3
  - 0.1
  - 0.03
  - 0.01
  - 0.003
  - 0.001
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
  ct_rate_classes:
  - Medical material
  - Arterial wall calcification
  - Cardiomegaly
  - Pericardial effusion
  - Coronary artery wall calcification
  - Hiatal hernia
  - Lymphadenopathy
  - Emphysema
  - Atelectasis
  - Lung nodule
  - Lung opacity
  - Pulmonary fibrotic sequela
  - Pleural effusion
  - Mosaic attenuation pattern
  - Peribronchial thickening
  - Consolidation
  - Bronchiectasis
  - Interlobular septal thickening
  rad_chestct_classes:
  - Calcification
  - Cardiomegaly
  - Pericardial effusion
  - Hiatal hernia
  - Emphysema
  - Atelectasis
  - Lung nodule
  - Lung opacity
  - Pulmonary fibrotic sequela
  - Pleural effusion
  - Peribronchial thickening
  - Consolidation
  - Bronchiectasis
  - Interlobular septal thickening
  - Lymphadenopathy
  - Medical material
bootstrap:
  n_resamples: 2000
  ctrate_seed: 2024
  rad_seed: 2025
  ci_percentiles:
  - 2.5
  - 97.5
  sample_round_dp: 6
output:
  root: /app/project/ibi-staff/CT-JEPA/public/outputs/exp_g_stride
  selected_configs: selected_configs
  per_run: per_run
  probes: probes
  aggregate: aggregate
