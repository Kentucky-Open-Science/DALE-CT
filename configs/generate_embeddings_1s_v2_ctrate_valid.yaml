# =============================================================================
# DALE-CT-1S-v2 Embedding Generation — CT-RATE VALID (npy, full 3,002-set)
# =============================================================================
# Legacy single-method script (ctrate_generate_embeddings.py) — apples-to-apples
# with dale_ct_1s/2s (same cropped_global crop). Saves .npy directly to
# main_output/<name>.npy.
#
# Usage: python scripts/ctrate_generate_embeddings.py --config_file <this>
# =============================================================================
train:
  model_type: Guided-Chest-CT-LeJEPA-V2   # 2S arch (patch16, 256/144); 1S-v2 inherits it
  vit_ckpt_path: /app/project/ibi-staff/CT-JEPA/public/outputs/LeJEPA_1S_v2/model_checkpoints/iter_66667/
  use_pretrained: false                    # load from local checkpoint (not HuggingFace)

dataset:
  # Z-Score normalization — byte-identical to 1S-v2 pre-training (see train config).
  clip_min: -997.0
  clip_max: 888.0
  mean_hu: -142.39
  std_hu: 360.97

# --- Data Source ---
validation:
  dataset_format: "npy"                    # CT-RATE valid = pre-extracted .npy volumes
  data_dir: /app/project/ibi-staff/CT-JEPA/Process_CT-RATE/dataset/CT-RATE_valid_hu/
  num_workers: 8

# --- Inference Mode ---
inference:
  mode: "cropped_global"                    # body-mask squared ROI (same as 1s/2s)
  extract_patches: false                   # CLS only -> (num_slices, 1024)

crops:
  global_crops_size: 256                    # 2S/0/1S-v2 global crop size (patch16 -> 16x16 grid)

output_folders:
  main_output: /app/project/ibi-staff/CT-JEPA/features/ctrate/lejepa_1s_v2_cropped_global/valid

# --- Required placeholders (config loader; not used by embedding generation) ---
distribution:
  type: "ddp"
projector:
  proj_dim: 128
  proj_hidden_dim: 2048
lora_config:
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.1
