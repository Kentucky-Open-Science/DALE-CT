# =============================================================================
# Model Comparison Study: Multi-Model Embedding Generation (Validation Split)
# =============================================================================
# Generates CLS + patch token embeddings for all 4 backbones on the same
# ReXGroundingCT-annotated validation scans (414 volumes) using the
# cropped_256 preprocessing.
#
# Each model's embeddings are saved to:
#   {output_root}/{model_key}/cropped_256/*.npz
#
# Usage:
#   python scripts/ctrate_generate_embeddings_model_comparison.py \
#       --config configs/generate_embeddings_model_comparison.yaml \
#       --model_key lejepa_0
# =============================================================================

# --- Model Selection ---
# Set via --model_key CLI arg. Supported: lejepa_0, lejepa_1s, lejepa_2s, dinov2_ct
model_key: null

# --- Dataset ---
dataset:
  clip_min: -997.0
  clip_max: 888.0
  mean_hu: -142.39
  std_hu: 360.97
  num_channels: 1

# --- Data Source ---
validation:
  dataset_format: "npy"
  data_dir: /app/project/ibi-staff/CT-JEPA/Process_CT-RATE/dataset/CT-RATE_valid_hu/
  label_csv: null
  num_workers: 8

# --- Volume List (generated by extract_model_comparison_groundtruth.py) ---
# Contains the ReXGroundingCT-annotated validation volume names.
volume_list: /app/project/ibi-staff/CT-JEPA/public/outputs/model_comparison_groundtruth/volume_names.json

# --- Preprocessing Method: cropped_256 only ---
# Body-cropped square ROI, resized to 256x256, CLS + patch tokens extracted.
methods:
  cropped_256:
    enabled: true
    crop: true
    resize_target: 256
    extract_patches: true
    description: "Body-cropped square ROI, resized to 256x256, CLS + patch tokens"

# --- Output ---
output_folders:
  main_output: /app/project/ibi-staff/CT-JEPA/public/outputs/model_comparison_embeddings/

# --- Required Placeholders ---
distribution:
  type: "ddp"
projector:
  proj_dim: 128
  proj_hidden_dim: 2048
lora_config:
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.1
