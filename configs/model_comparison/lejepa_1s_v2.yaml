# =============================================================================
# Model Comparison: LeJEPA-1S-v2 (DALE-CT-1S-v2, patch_size=16, img_size=512, timm)
# =============================================================================
# 2S architecture (patch16, dense+global TS soft labels, ReX-inert), trained
# 2026-07-10 (iter_66667). NOT published to HuggingFace Hub — the bare-backbone
# safetensors checkpoint is loaded from a local path via
# BACKBONE_SPECS["lejepa_1s_v2"].weights_path in utils/hf_backbone_loader.py.
# Architecture: ViT-Large, patch_size=16, img_size=512, in_chans=1.
# No register tokens. 256 is divisible by 16 → no patch-aligned resize needed.
# =============================================================================

# --- Model Selection ---
model_key: lejepa_1s_v2

# --- Model Specification (mirrors BACKBONE_SPECS in hf_backbone_loader.py) ---
# NOTE: load_backbone() reads weights_path from BACKBONE_SPECS, not from this
# block (which is documentation only). Kept in sync for readability.
model:
  repo_id: "Kentucky-Open-Science/DALE-CT-2S"
  backbone_type: "timm"
  patch_size: 16
  native_img_size: 512
  in_chans: 1
  embed_dim: 1024
  num_register_tokens: 0
  weights_path: "/project/ibi-staff/CT-JEPA/public/outputs/LeJEPA_1S_v2/model_checkpoints/iter_66667/model.safetensors"

# --- Dataset ---
dataset:
  clip_min: -997.0
  clip_max: 888.0
  mean_hu: -142.39
  std_hu: 360.97
  num_channels: 1

# --- Data Source ---
validation:
  dataset_format: "npy"
  data_dir: /app/project/ibi-staff/CT-JEPA/Process_CT-RATE/dataset/CT-RATE_valid_hu/
  label_csv: null
  num_workers: 8

# --- Volume List (generated by extract_model_comparison_groundtruth.py) ---
volume_list: /app/project/ibi-staff/CT-JEPA/public/outputs/model_comparison_groundtruth/volume_names.json

# --- Preprocessing Method: cropped_256 ---
# Body-cropped square ROI, resized to 256x256 (patch-aligned for patch_size=16).
methods:
  cropped_256:
    enabled: true
    crop: true
    resize_target: 256
    extract_patches: true
    description: "Body-cropped square ROI, resized to 256x256, CLS + patch tokens"

# --- Output ---
output_folders:
  main_output: /app/project/ibi-staff/CT-JEPA/public/outputs/model_comparison_embeddings/

# --- Required Placeholders ---
distribution:
  type: "ddp"
projector:
  proj_dim: 128
  proj_hidden_dim: 2048
lora_config:
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.1
