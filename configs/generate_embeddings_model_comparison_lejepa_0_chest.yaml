# =============================================================================
# Model Comparison: DALE-CT-0-L ("chest", patch_size=16, img_size=512, timm)
# =============================================================================
# Variant-0 pure SSL on the full ~296k-case multi-source pool
# (LeJEPA_0_chest_z1full, iter_191357, no aux head, ViT-L/patch16), trained
# 2026-07-17. NOT published to HuggingFace Hub — the bare-backbone safetensors
# checkpoint is loaded from a local path via
# BACKBONE_SPECS["lejepa_0_chest"].weights_path in utils/hf_backbone_loader.py.
# Architecture: ViT-Large, patch_size=16, img_size=512, in_chans=1.
# No register tokens. 256 is divisible by 16 → no patch-aligned resize needed.
#
# NORMALIZATION (per-model): Cropped256Preprocessor reads clip/mean/std from
# the backbone spec (BACKBONE_SPECS["lejepa_0_chest"] = chest's full-pool
# z-score stats: clip[-940.8, 923.1], mean -25.03, std 246.87). The
# config.dataset block below mirrors those stats for documentation only —
# CTMultiScaleDataset (the npy-validation path this script uses) returns RAW
# HU and does NOT normalize; the preprocessor is the sole normalizer. Same
# procedure as the released CT-RATE models (0.5/99.5 percentile clip + mean/std
# normalize); only the stats differ, because they are fit to a different pool.
# =============================================================================

# --- Model Selection ---
model_key: lejepa_0_chest

# --- Model Specification (mirrors BACKBONE_SPECS in hf_backbone_loader.py) ---
# NOTE: load_backbone() reads weights_path from BACKBONE_SPECS, not from this
# block (which is documentation only). Kept in sync for readability.
model:
  repo_id: "Kentucky-Open-Science/DALE-CT-2S"
  backbone_type: "timm"
  patch_size: 16
  native_img_size: 512
  in_chans: 1
  embed_dim: 1024
  num_register_tokens: 0
  weights_path: "/project/ibi-staff/CT-JEPA/public/outputs/LeJEPA_0_chest_z1full/model_checkpoints/iter_191357/model.safetensors"

# --- Dataset (stats = chest's full-pool z-score fit; documentation only —
#     the preprocessor normalizes, not the dataloader) ---
dataset:
  clip_min: -940.8
  clip_max: 923.1
  mean_hu: -25.03
  std_hu: 246.87
  num_channels: 1

# --- Data Source ---
validation:
  dataset_format: "npy"
  data_dir: /app/project/ibi-staff/CT-JEPA/Process_CT-RATE/dataset/CT-RATE_valid_hu/
  label_csv: null
  num_workers: 8

# --- Volume List (generated by extract_model_comparison_groundtruth.py) ---
volume_list: /app/project/ibi-staff/CT-JEPA/public/outputs/model_comparison_groundtruth/volume_names.json

# --- Preprocessing Method: cropped_256 ---
# Body-cropped square ROI, resized to 256x256. patch_size=16 divides 256 →
# patch_aligned_target null (no second nearest-neighbor resize).
methods:
  cropped_256:
    enabled: true
    crop: true
    resize_target: 256
    extract_patches: true
    patch_aligned_target: null
    description: "Body-cropped square ROI, resized to 256x256, CLS + patch tokens"

# --- Output ---
output_folders:
  main_output: /app/project/ibi-staff/CT-JEPA/public/outputs/model_comparison_embeddings/

# --- Required Placeholders ---
distribution:
  type: "ddp"
projector:
  proj_dim: 128
  proj_hidden_dim: 2048
lora_config:
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.1
