# =============================================================================
# DALE-CT-0 chest Embedding Generation — CT-RATE TRAIN (full set, WebDataset)
# =============================================================================
# Legacy single-method script (ctrate_generate_embeddings.py) — apples-to-apples
# with dale_ct_1s/2s/1s_v2: same MultiScaleSliceProcessor cropped_global body-mask
# crop (NOT the multimethod MultiMethodProcessor cropped_256 crop).
#
# The script saves .npy directly to output_dir/<name>.npy (main_output), so
# main_output = .../lejepa_0_chest_cropped_global/train matches the layout that
# build_fair_subset.sh symlinks from (dale_ct_0_chest spec).
#
# vit_ckpt_path uses the __VIT_CKPT_PATH__ placeholder: run_dale0_chest_embed.sh
# resolves the latest iter_*/model.safetensors under the chest run's
# model_checkpoints/ at runtime and substitutes it (final iter not known until
# training writes DONE).
#
# Usage: python scripts/ctrate_generate_embeddings.py --config_file <this>
# =============================================================================
train:
  model_type: Guided-Chest-CT-LeJEPA-V2   # 2S arch (patch16, 256/144); chest inherits it
  vit_ckpt_path: __VIT_CKPT_PATH__         # resolved at runtime by run_dale0_chest_embed.sh
  use_pretrained: false                    # load from local checkpoint (not HuggingFace)

dataset:
  # Z-Score normalization — byte-identical to DALE-CT-0 chest pre-training
  # (configs/pretrain_lejepa_0_chest_z1full.yaml: full-pool foreground fit).
  # normalization_mode is OMITTED -> defaults to 'z_score' (the training-time
  # math: clamp[clip_min,clip_max] -> 0-1 -> (x-norm_mean)/norm_std). Do NOT set
  # 'dinomx' (that z-scores raw HU directly = WRONG for chest).
  # EVAL/EMBED CONFIGS MUST REUSE THESE EXACT VALUES (clip [-940.8, 923.1],
  # mean -25.03, std 246.87) ~= Normalize([0.4913],[0.1325]).
  clip_min: -940.8
  clip_max: 923.1
  mean_hu: -25.03
  std_hu: 246.87

# --- Data Source ---
validation:
  dataset_format: "webdataset"             # CT-RATE train = tar shards (final_2 = full set)
  tar_pattern: /app/project/ibi-staff/CT-JEPA/Process_CT-RATE/dataset/CT-RATE_train_tar_ts_rex_final_2/*.tar
  # 4 (not 8) — first E1 run died at 30,695/46,397 on a PyTorch DataLoader shm
  # unlink race ("could not unlink the shared memory file ... No such file or
  # directory"), a known multi-worker /dev/shm teardown race. Halving the worker
  # count halves concurrent shm files → fewer teardown races. Re-runs skip the
  # 30,695 already-extracted .npy (embedder validates+continues on existing).
  num_workers: 4

# --- Inference Mode ---
inference:
  mode: "cropped_global"                    # body-mask squared ROI (same as 1s/2s/1s_v2)
  extract_patches: false                   # CLS only -> (num_slices, 1024), matches dale_ct_1s/2s

crops:
  global_crops_size: 256                    # 2S/0/1S-v2 global crop size (patch16 -> 16x16 grid)

output_folders:
  main_output: /app/project/ibi-staff/CT-JEPA/features/ctrate/lejepa_0_chest_cropped_global/train

# --- Required placeholders (config loader; not used by embedding generation) ---
distribution:
  type: "ddp"
projector:
  proj_dim: 128
  proj_hidden_dim: 2048
lora_config:
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.1
